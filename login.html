<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache">
<title>CYBER SHIELD 3.0 v10</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--bg:#050a14;--card:rgba(17,29,50,0.75);--border:rgba(27,47,83,0.6);--text:#e6edf5;--text2:#7a8aaa;--accent:#00d4ff;--green:#3dd598;--red:#ff5a65;--font:1}
body.theme-light{--bg:#f4f6fb;--card:#fff;--border:#dbe2ef;--text:#1a2332;--text2:#6b7a99;--accent:#0066ff}
body.theme-hacker{--bg:#020a02;--card:#0a1f0a;--border:#1a4a1a;--text:#7cff7c;--text2:#4a8a4a;--accent:#00ff41}
body.high-contrast{--bg:#000;--card:#000;--border:#fff;--text:#fff;--text2:#fff;--accent:#ffff00}
*{margin:0;padding:0;box-sizing:border-box} body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;font-size:calc(16px * var(--font))}
.left{flex:1.2;padding:28px;display:flex;flex-direction:column;gap:16px} .right{flex:1;background:rgba(5,10,20,0.6);backdrop-filter:blur(20px);border-left:1px solid var(--border);display:flex;align-items:center;justify-content:center;padding:24px}
.eagle{width:100%;max-width:380px;border-radius:16px;box-shadow:0 0 50px rgba(0,212,255,0.4);border:1px solid var(--border)}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px}
.tabs{display:flex;background:rgba(0,0,0,0.3);border-radius:10px;padding:4px;margin:14px 0} .tab{flex:1;padding:10px;text-align:center;border-radius:8px;cursor:pointer;color:var(--text2)} .tab.active{background:var(--accent);color:#000;font-weight:700}
input{width:100%;padding:12px;background:rgba(0,0,0,0.4);border:1px solid var(--border);border-radius:10px;color:var(--text);margin-top:6px;font-family:'JetBrains Mono',monospace}
.btn{width:100%;padding:13px;border-radius:10px;border:none;font-weight:700;cursor:pointer;margin-top:12px} .btn-primary{background:var(--accent);color:#000}
.controls{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px} .controls select,.controls button{padding:5px 7px;border-radius:6px;background:var(--bg);color:var(--text);border:1px solid var(--border);font-size:11px;cursor:pointer}
#mapMini{height:200px;border-radius:10px;margin-top:8px;border:1px solid var(--border)}
@media(max-width:900px){body{flex-direction:column}.right{border-left:none;border-top:1px solid var(--border)}}
</style>
</head>
<body class="theme-dark">
<div class="left">
  <div style="display:flex;gap:10px;align-items:center"><div style="width:40px;height:40px;background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#000;font-weight:700">⬡</div><div><b>CYBER SHIELD 3.0</b><div style="font-size:10px;color:var(--text2)">v10 EAGLE + WORLD MAP</div></div></div>
  <img src="eagle.png" class="eagle" onerror="this.src='https://i.imgur.com/8Km9tLL.png'">
  <div class="card">
    <b style="font-size:12px">🗺️ Global Map - Zoom to City</b>
    <div style="display:flex;gap:6px;margin-top:8px"><input id="miniSearch" placeholder="Sadhaura, India, USA..." style="margin:0"><button onclick="miniSearch()" style="padding:8px 12px;border-radius:8px;background:var(--accent);border:none;font-weight:700">Go</button></div>
    <div id="mapMini"></div>
    <div style="display:flex;gap:5px;margin-top:6px;flex-wrap:wrap"><button onclick="miniFly('India')" style="font-size:10px">India</button><button onclick="miniFly('Haryana')">Haryana</button><button onclick="miniFly('Sadhaura')">Sadhaura</button></div>
  </div>
</div>
<div class="right">
  <div class="card" style="max-width:380px;width:100%">
    <h3>Welcome back</h3><p style="font-size:11px;color:var(--text2)">SOC Access + Customization</p>
    <div style="margin-top:10px;padding:8px;background:rgba(0,0,0,0.3);border-radius:8px;border:1px dashed var(--border)">
      <div style="font-size:9px;color:var(--text2)">USER CUSTOMIZATION</div>
      <div class="controls">
        <select id="langS" onchange="changeLang(this.value)"><option value="en">EN</option><option value="hi">HI</option><option value="ta">TA</option><option value="ar">AR</option><option value="ur">UR</option></select>
        <select id="themeS" onchange="changeTheme(this.value)"><option value="dark">Dark</option><option value="light">Light</option><option value="hacker">Hacker</option></select>
        <button onclick="changeFont(-0.1)">A-</button><button onclick="changeFont(0.1)">A+</button>
        <button onclick="toggleContrast()" id="cBtn">Contrast</button>
      </div>
    </div>
    <div class="tabs"><div class="tab active" id="tL" onclick="switchTab('login')">Login</div><div class="tab" id="tR" onclick="switchTab('register')">Register</div></div>
    <input id="username" placeholder="admin"><input id="password" type="password" placeholder="Password" style="margin-top:8px">
    <button class="btn btn-primary" onclick="handleAuth()" id="mainBtn">Authenticate →</button>
    <div id="msg" style="margin-top:10px;font-size:12px;text-align:center;min-height:16px"></div>
    <div style="font-size:10px;color:var(--text2);text-align:center;margin-top:8px">Demo: admin / admin123</div>
  </div>
</div>
<script>
let mode='login', miniMap;
const tr={en:{login:"Login",register:"Register"},hi:{login:"लॉगिन",register:"रजिस्टर"},ta:{login:"உள்நுழை",register:"பதிவு"},ar:{login:"دخول",register:"تسجيل"},ur:{login:"لاگ ان",register:"رجسٹر"}};
function switchTab(m){mode=m; document.getElementById('tL').classList.toggle('active',m==='login'); document.getElementById('tR').classList.toggle('active',m==='register'); document.getElementById('mainBtn').innerText=m==='login'?'Authenticate →':'Create Account →';}
function changeLang(l){localStorage.setItem('cy_lang',l); let t=tr[l]||tr.en; document.getElementById('tL').innerText=t.login; document.getElementById('tR').innerText=t.register; document.getElementById('langS').value=l; document.documentElement.dir=(l==='ar'||l==='ur')?'rtl':'ltr';}
function changeTheme(t){document.body.className=(document.body.classList.contains('high-contrast')?'high-contrast ':'')+'theme-'+t; localStorage.setItem('cy_theme',t); document.getElementById('themeS').value=t;}
function changeFont(d){let s=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--font'))||1; s=Math.min(1.4,Math.max(0.8,s+d)); document.documentElement.style.setProperty('--font',s); localStorage.setItem('cy_font',s);}
function toggleContrast(){document.body.classList.toggle('high-contrast'); document.getElementById('cBtn').innerText=document.body.classList.contains('high-contrast')?'Normal':'Contrast';}
function showMsg(t,c){document.getElementById('msg').style.color=c||'#00d4ff'; document.getElementById('msg').innerText=t;}
function handleAuth(){mode==='login'?login():register();}
async function register(){let u=username.value.trim(), p=password.value.trim(); if(!u||!p){showMsg("Enter details","#ff5a65");return} let users=JSON.parse(localStorage.getItem('offline_users')||'{}'); users[u]=p; localStorage.setItem('offline_users',JSON.stringify(users)); showMsg("✅ Registered! Login now","#3dd598"); switchTab('login');}
async function login(){let u=username.value.trim(), p=password.value.trim(); let users=JSON.parse(localStorage.getItem('offline_users')||'{}'); if((users[u]&&users[u]===p)||(u==='admin'&&p==='admin123')){localStorage.setItem('token','offline-'+u); localStorage.setItem('username',u); showMsg("✅ Success! Redirecting...","#3dd598"); setTimeout(()=>location.href='index.html?v=10',600);}else showMsg("❌ Invalid","#ff5a65");}
function initMini(){miniMap=L.map('mapMini').setView([30.1,77.1],5); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(miniMap); L.marker([30.149,77.19]).addTo(miniMap).bindPopup("Sadhaura");}
function miniFly(q){fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}`).then(r=>r.json()).then(d=>{if(d[0]){miniMap.flyTo([d[0].lat,d[0].lon], q==='Sadhaura'?14:6); L.marker([d[0].lat,d[0].lon]).addTo(miniMap).bindPopup(q);}});}
function miniSearch(){miniFly(document.getElementById('miniSearch').value);}
setTimeout(initMini,500);
changeTheme(localStorage.getItem('cy_theme')||'dark'); changeLang(localStorage.getItem('cy_lang')||'en'); if(localStorage.getItem('cy_font')){document.documentElement.style.setProperty('--font',localStorage.getItem('cy_font'))}
</script>
</body>
</html>
