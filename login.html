<!DOCTYPE html>
<html>
<head>
<title>CYBER SHIELD - Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{--bg:#080e1d;--card:#111d32;--border:#1b2f53;--text:#cbd5e1;--accent:#3ac4ff}
body{background:var(--bg);color:var(--text);font-family:Arial;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
.card{background:var(--card);padding:30px;border-radius:12px;width:340px;border:1px solid var(--border);box-shadow:0 10px 30px rgba(0,0,0,0.5)}
input{width:100%;padding:12px;margin:8px 0;background:var(--bg);border:1px solid var(--border);color:white;border-radius:6px;box-sizing:border-box}
button{width:100%;padding:12px;border:none;border-radius:6px;font-weight:bold;cursor:pointer;margin-top:10px}
.btn-primary{background:var(--accent);color:#000}
.btn-sec{background:transparent;border:1px solid var(--accent);color:var(--accent)}
#msg{margin-top:12px;font-size:12px;min-height:18px;text-align:center}
small{font-size:10px;color:#6b7a99}
</style>
</head>
<body>
<div class="card">
<h2 style="margin:0">CYBER SHIELD 3.0</h2>
<p style="font-size:12px;color:#6b7a99">Security Center Login</p>
<input id="username" placeholder="Username (e.g. admin)">
<input id="password" type="password" placeholder="Password (e.g. admin123)">
<button class="btn-primary" onclick="register()">Register</button>
<button class="btn-sec" onclick="login()">Login</button>
<p id="msg"></p>
<small>Backend: <span id="backendStatus">Checking...</span><br>Tip: First click Register, then Login. If backend offline, it uses offline mode.</small>
</div>

<script>
const API_URL = "http://127.0.0.1:8000"; // Change to your Render URL after deploy
const msgEl = document.getElementById('msg');
const statusEl = document.getElementById('backendStatus');

function showMsg(text, color){
  msgEl.style.color = color || '#3ac4ff';
  msgEl.innerText = text;
}

// Check backend
(async()=>{
  try{
    let r = await fetch(`${API_URL}/`, {method:'GET'});
    if(r.ok){ statusEl.innerText = "Connected ✅"; statusEl.style.color="#3dd598"; }
    else{ statusEl.innerText = "Offline Mode (Browser Storage) ⚠️"; statusEl.style.color="#f5c542"; }
  }catch(e){
    statusEl.innerText = "Offline Mode (Browser Storage) ⚠️"; statusEl.style.color="#f5c542";
  }
})();

async function register(){
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value.trim();
  if(!u || !p){ showMsg("Enter username and password!", "#ff6b6b"); return; }
  
  showMsg("Registering...", "#f5c542");
  
  // TRY BACKEND FIRST
  try{
    let res = await fetch(`${API_URL}/register?username=${encodeURIComponent(u)}&password=${encodeURIComponent(p)}`, {method:'POST'});
    let data = await res.json();
    if(res.ok){
      showMsg("✅ " + (data.message || "Registered! Now click Login"), "#3dd598");
      return;
    }else{
      showMsg("❌ " + (data.detail || "Failed"), "#ff6b6b");
      // If user already exists, still allow login
      if(data.detail && data.detail.includes("exists")){
        return;
      }
    }
  }catch(e){
    console.log("Backend not reachable, using offline mode", e);
  }

  // OFFLINE FALLBACK - Save in browser
  let users = JSON.parse(localStorage.getItem('offline_users') || '{}');
  if(users[u]){
    showMsg("❌ User already exists! Click Login", "#ff6b6b");
  }else{
    users[u] = p;
    localStorage.setItem('offline_users', JSON.stringify(users));
    showMsg("✅ Registered in Offline Mode! Now click Login", "#3dd598");
  }
}

async function login(){
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value.trim();
  if(!u || !p){ showMsg("Enter username and password!", "#ff6b6b"); return; }

  showMsg("Logging in...", "#f5c542");

  // TRY BACKEND FIRST
  try{
    let form = new FormData();
    form.append('username', u);
    form.append('password', p);
    let res = await fetch(`${API_URL}/login`, {method:'POST', body: form});
    let data = await res.json();
    if(res.ok && data.access_token){
      localStorage.setItem('token', data.access_token);
      localStorage.setItem('username', u);
      showMsg("✅ Login success! Redirecting...", "#3dd598");
      setTimeout(()=>{ window.location.href='index.html'; }, 500);
      return;
    }else{
      // Don't return, try offline mode too
      console.log("Backend login failed", data);
    }
  }catch(e){
    console.log("Backend not reachable", e);
  }

  // OFFLINE FALLBACK
  let users = JSON.parse(localStorage.getItem('offline_users') || '{}');
  // Allow default test account too
  if((users[u] && users[u] === p) || (u==='admin' && p==='admin123') || (u==='test' && p==='test123')){
    localStorage.setItem('token', 'offline-token-'+u);
    localStorage.setItem('username', u);
    showMsg("✅ Login success (Offline)! Redirecting...", "#3dd598");
    setTimeout(()=>{ window.location.href='index.html'; }, 500);
  }else{
    showMsg("❌ Invalid username/password. Did you Register first?", "#ff6b6b");
  }
}
</script>
</body>
</html>
