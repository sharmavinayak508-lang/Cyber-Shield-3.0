<!DOCTYPE html>
<html lang="en"><head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cyber Shield — Dashboard</title><link rel="manifest" href="manifest.json">
<style>body{margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,sans-serif;background:#050a14;color:#fff}.wrap{max-width:980px;margin:0 auto;padding:16px}h1{color:#ffaa00}.card{background:#0d1628;border:1px solid #00d4ff;border-radius:14px;padding:16px;margin:12px 0}input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid #333;background:#0a1222;color:#fff;margin:6px 0}button{cursor:pointer;border:0;border-radius:10px;padding:11px;font-weight:800} .blue{background:#00d4ff}.green{background:#00ff88}.red{background:#ff4444;color:#fff}.orange{background:#ff8800}.ghost{background:transparent;border:1px solid #00d4ff;color:#fff}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.small{font-size:12px;color:#9fb0cc}table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid #223;padding:8px;text-align:left}.bar{height:14px;background:#223;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#00ff88}.pill{display:inline-block;padding:3px 9px;border-radius:99px;background:#1a2b4a;font-size:11px}.hidden{display:none}</style></head>
<body><div class="wrap">
<h1>🛡️ CYBER SHIELD</h1>
<p class="small" id="who"></p>
<div class="card"><b>🔔 Notifications</b><div id="notifBox"></div><button class="ghost" onclick="clearNotif()">Mark All Read</button></div>

<div class="card"><b>📊 Overview</b><p>Users: <b id="statUsers">—</b> • Logins: <b id="statLogins">—</b> • Tickets: <b id="statTickets">—</b> • Sessions: <b id="statSessions">—</b></p>
<canvas id="activityChart" height="120"></canvas></div>

<div class="card"><b>👤 My Profile</b>
<input id="pName" placeholder="Full Name"><input id="pPhone" placeholder="Phone"><input id="pCity" placeholder="City">
<label>Profile Photo</label><input type="file" id="pPhoto" accept="image/*"><img id="pPreview" style="width:80px;height:80px;border-radius:50%;object-fit:cover;display:none">
<button class="green" onclick="saveProfile()">Save Profile</button>
<input id="newPass" type="password" placeholder="New Password (min 8 chars)"><button class="blue" onclick="changePassword()">Change Password</button>
<p class="small" id="profileMsg"></p></div>


<div class="card"><b>😀 Face Sign-in</b>
<p class="small">Optional. Password sign-in always works.</p>
<div class="row"><button class="green" onclick="enrollFaceWebAuthn()">Enroll Face ID / Fingerprint</button>
<button class="blue" onclick="enrollFaceCamera()">Enroll Camera Face</button>
<button class="red" onclick="removeFace()">Remove Face Sign-in</button></div>
<video id="dashFaceVideo" width="100%" style="border-radius:10px;display:none" autoplay playsinline muted></video>
<canvas id="dashFaceCanvas" width="320" height="240" style="display:none"></canvas>
<p class="small" id="faceEnrollMsg"></p><p class="small" id="faceStatus"></p></div>
<div class="card"><b>📱 Sessions & Login History</b><div id="sessionBox"></div><button class="red" onclick="logoutAll()">Logout From All Devices</button>
<div id="historyBox" class="small"></div></div>

<div class="card"><b>📣 Announcements</b><input id="annTitle" placeholder="Announcement title"><textarea id="annText" placeholder="Announcement message"></textarea><button class="blue" onclick="postAnnouncement()">Post Announcement</button><div id="annBox"></div>
</div>

<div class="card"><b>👥 Users</b>
<div class="row"><input id="searchBox" placeholder="Search name / email / city" oninput="renderUsers()"><select id="filterRole" onchange="renderUsers()"><option value="">All Roles</option><option value="super_admin">Super Admin</option><option value="admin">Admin</option><option value="user">User</option><option value="viewer">Viewer</option><option value="blocked">Blocked Only</option></select></div>
<div class="row"><button class="orange" onclick="bulkBlock()">Block Selected</button><button class="green" onclick="bulkUnblock()">Unblock Selected</button><button class="red" onclick="bulkDelete()">Delete Selected</button>
<button class="blue" onclick="exportCSV()">Export CSV</button><button class="blue" onclick="exportExcel()">Export Excel</button><button class="blue" onclick="exportPDF()">Export PDF</button></div>
<div style="overflow:auto"><table><thead><tr><th>✓</th><th>Name</th><th>Email</th><th>City</th><th>Role</th><th>Status</th><th>Action</th></tr></thead><tbody id="userRows"></tbody></table></div></div>

<div class="card"><b>🎫 Support Tickets & Admin Requests</b><div id="ticketList"></div><div id="adminReqBox"></div></div>
<div class="card"><button class="red" onclick="logout()">Logout</button> <button class="ghost" onclick="location.href='mode2-login.html'">Back to Login</button></div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<script src="mode2-config.js"></script>
<script>
let allUsers=[], me=null;
async function getNotifFS(){ if(!me) return []; const s=await window.CyberDB.collection('notifications').where('uid','==',me.uid).orderBy('createdAt','desc').limit(20).get(); return s.docs.map(d=>d.data().text); }
function getNotif(){ return []; }

// Face Scan enrollment (Dashboard)
function faceKeyD(email){ return 'cyber_face_'+(email||'').toLowerCase(); }
function webauthnKeyD(email){ return 'cyber_webauthn_'+(email||'').toLowerCase(); }
function updateFaceStatus(){ const email=(me&&me.email)||''; const hasW=!!localStorage.getItem(webauthnKeyD(email)); const hasC=!!localStorage.getItem(faceKeyD(email)); const el=document.getElementById('faceStatus'); if(el) el.innerText='Status for '+email+': Device Face ID: '+(hasW?'✅ Enrolled':'❌ Not enrolled')+' • Camera Photo: '+(hasC?'✅ Enrolled':'❌ Not enrolled')+' • Password: ✅ Always available'; }
async function enrollFaceWebAuthn(){ if(!me) return alert('Sign in first.'); try{ const email=me.email; const challenge=crypto.getRandomValues(new Uint8Array(32)); const cred=await navigator.credentials.create({publicKey:{challenge, rp:{name:'Cyber Shield', id:location.hostname}, user:{id:new TextEncoder().encode(email), name:email, displayName:email}, pubKeyCredParams:[{alg:-7,type:'public-key'},{alg:-257,type:'public-key'}], authenticatorSelection:{authenticatorAttachment:'platform', userVerification:'required'}, timeout:60000, attestation:'none'}}); let s=''; new Uint8Array(cred.rawId).forEach(b=>s+=String.fromCharCode(b)); localStorage.setItem(webauthnKeyD(email), JSON.stringify({id:btoa(s), type:cred.type})); document.getElementById('faceEnrollMsg').innerText='Device Face ID enrolled on THIS device. Now on login page, choose Face Scan — Device Face ID.'; updateFaceStatus(); }catch(e){ document.getElementById('faceEnrollMsg').innerText='Face enrollment failed / cancelled: '+e.message+' — Password login still works.'; } }
async function enrollFaceCamera(){ if(!me) return alert('Sign in first.'); try{ const v=document.getElementById('dashFaceVideo'); const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}}); v.srcObject=st; v.style.display='block'; document.getElementById('faceEnrollMsg').innerText='Camera on — position your face, then tap Capture Face Photo below.'; if(!document.getElementById('dashCaptureBtn')){ const b=document.createElement('button'); b.id='dashCaptureBtn'; b.className='blue'; b.innerText='📸 Capture Face Photo (Real)'; b.onclick=()=>{ const c=document.getElementById('dashFaceCanvas'); c.getContext('2d').drawImage(v,0,0,320,240); const shot=c.toDataURL('image/jpeg',0.7); localStorage.setItem(faceKeyD(me.email), shot); st.getTracks().forEach(t=>t.stop()); v.style.display='none'; document.getElementById('faceEnrollMsg').innerText='Camera face enrolled (Real) — descriptor saved to Firestore. Now on login page, choose Face Scan — Camera Photo.'; updateFaceStatus(); }; document.getElementById('faceEnrollMsg').parentElement.appendChild(b); } }catch(e){ document.getElementById('faceEnrollMsg').innerText='Camera blocked: '+e.message; } }
function removeFace(){ if(!me) return; if(!confirm('Remove ALL face enrollments on this device? Password login will still work.')) return; localStorage.removeItem(faceKeyD(me.email)); localStorage.removeItem(webauthnKeyD(me.email)); localStorage.removeItem('cyber_face_last_capture'); document.getElementById('faceEnrollMsg').innerText='Face enrollment removed. Password login still works.'; updateFaceStatus(); }
const _origRenderLocal = renderLocal; renderLocal = function(){ _origRenderLocal(); updateFaceStatus(); };

async function renderNotif(){ let n=[]; try{ n=await getNotifFS(); }catch(e){} document.getElementById('notifBox').innerHTML=n.length?n.map(x=>'🔔 '+x).join('<br>'):'No new notifications in Firestore.'; }
async function clearNotif(){ if(!me) return; const s=await window.CyberDB.collection('notifications').where('uid','==',me.uid).get(); for(const d of s.docs) await d.ref.delete(); renderNotif(); }
async function pushNotif(t){ try{ if(me) await window.CyberDB.collection('notifications').add({uid:me.uid, text:t, createdAt:firebase.firestore.FieldValue.serverTimestamp()}); }catch(e){} renderNotif(); }
async function pushNotifFS(t){ return pushNotif(t); }
window.CyberAuth.onAuthStateChanged(async user=>{ if(!user){ location.href='mode2-login.html'; return; } me=user; document.getElementById('who').innerText='Signed in as: '+user.email+' • UID: '+user.uid; try{ const d=await window.CyberDB.collection('users').doc(user.uid).get(); if(d.exists){ const u=d.data(); document.getElementById('pName').value=u.name||''; document.getElementById('pPhone').value=u.phone||''; document.getElementById('pCity').value=u.city||''; if(u.photo){ const im=document.getElementById('pPreview'); im.src=u.photo; im.style.display='block'; } } }catch(e){} loadUsers(); renderLocal(); });
async function renderLocal(){ let h=[],s=[],t=[]; try{ if(me){ const hs=await window.CyberDB.collection('login_history').where('uid','==',me.uid).orderBy('createdAt','desc').limit(20).get(); h=hs.docs.map(d=>d.data()); } }catch(e){} try{ if(me){ const ss=await window.CyberDB.collection('sessions').where('uid','==',me.uid).orderBy('createdAt','desc').limit(20).get(); s=ss.docs.map(d=>({id:d.id,...d.data()})); } }catch(e){} try{ const ts=await window.CyberDB.collection('support_tickets').orderBy('createdAt','desc').limit(30).get(); t=ts.docs.map(d=>({id:d.id,...d.data()})); }catch(e){} document.getElementById('statLogins').innerText=h.length; document.getElementById('statSessions').innerText=s.length; document.getElementById('statTickets').innerText=t.length; document.getElementById('sessionBox').innerHTML=s.length?s.map(x=>(x.time||'')+' • '+(x.device||'')+' <button onclick="revokeSession(\''+x.id+'\')">Revoke</button>').join('<br>'):'No sessions in Firestore.'; document.getElementById('historyBox').innerHTML='<b>Login History (Firestore):</b><br>'+(h.length?h.map(x=>(x.time||'')+' • '+(x.ok?'✅':'❌')+' • '+(x.method||'password')+' • '+(x.device||'')).join('<br>'):'None'); document.getElementById('ticketList').innerHTML=t.length?t.map(x=>'#'+x.id.slice(-4)+' '+(x.email||'')+': '+(x.text||'')+' ['+(x.status||'Open')+'] <button onclick="closeTicketFS(\''+x.id+'\')">Close</button>').join('<br>'):'No tickets in Firestore.'; try{ const ctx=document.getElementById('activityChart'); if(ctx){ if(window._chart) window._chart.destroy(); window._chart=new Chart(ctx,{type:'bar',data:{labels:['Users','Logins','Tickets','Sessions'],datasets:[{label:'Count',data:[allUsers.length||0,h.length,t.length,s.length],backgroundColor:['#00d4ff','#00ff88','#ff8800','#ff4444']}]},options:{responsive:true,plugins:{legend:{display:false}}}}); } }catch(e){} }
async function revokeSession(id){ await window.CyberDB.collection('sessions').doc(id).delete(); pushNotifFS('Session revoked.'); renderLocal(); }
async function closeTicketFS(id){ await window.CyberDB.collection('support_tickets').doc(id).update({status:'Closed'}); pushNotifFS('Ticket closed.'); renderLocal(); }
async function closeTicket(i){ /* legacy - now Firestore */ renderLocal(); }
async function loadUsers(){ try{ const snap=await window.CyberDB.collection('users').get(); allUsers=snap.docs.map(d=>({id:d.id,...d.data()})); document.getElementById('statUsers').innerText=allUsers.length; renderUsers(); }catch(e){ document.getElementById('userRows').innerHTML='<tr><td colspan=7>Could not load users. Check Firestore rules. '+e.message+'</td></tr>'; } }
function renderUsers(){ const q=(document.getElementById('searchBox').value||'').toLowerCase(); const f=document.getElementById('filterRole').value; const list=allUsers.filter(u=>{ const hay=((u.name||'')+' '+(u.email||'')+' '+(u.city||'')).toLowerCase(); if(q && !hay.includes(q)) return false; if(f==='blocked' && !u.blocked) return false; if(f && f!=='blocked' && u.role!==f) return false; return true; }); document.getElementById('userRows').innerHTML=list.map(u=>'<tr><td><input type="checkbox" class="sel" value="'+u.id+'"></td><td>'+(u.name||'')+'</td><td>'+(u.email||'')+'</td><td>'+(u.city||'')+'</td><td>'+(u.role||'')+'</td><td>'+(u.blocked?'🚫 Blocked':'✅ Active')+'</td><td><button onclick="toggleBlock(\''+u.id+'\','+!!u.blocked+')">'+(u.blocked?'Unblock':'Block')+'</button> <button onclick="delUser(\''+u.id+'\')">Delete</button></td></tr>').join('')||'<tr><td colspan=7>No users match.</td></tr>'; }
async function toggleBlock(id,was){ await window.CyberDB.collection('users').doc(id).update({blocked:!was}); pushNotif('User '+(was?'unblocked':'blocked')+'.'); loadUsers(); }
async function delUser(id){ if(!confirm('Delete this user?')) return; await window.CyberDB.collection('users').doc(id).delete(); try{ await window.CyberDB.collection('users').doc(id).delete(); }catch(e){} pushNotif('User deleted.'); loadUsers(); }
function selected(){ return [...document.querySelectorAll('.sel:checked')].map(x=>x.value); }
async function bulkBlock(){ for(const id of selected()) await window.CyberDB.collection('users').doc(id).update({blocked:true}); pushNotif('Bulk block done.'); loadUsers(); }
async function bulkUnblock(){ for(const id of selected()) await window.CyberDB.collection('users').doc(id).update({blocked:false}); pushNotif('Bulk unblock done.'); loadUsers(); }
async function bulkDelete(){ if(!confirm('Delete selected users?')) return; for(const id of selected()) await window.CyberDB.collection('users').doc(id).delete(); pushNotif('Bulk delete done.'); loadUsers(); }
async function saveProfile(){ if(!me) return; const data={name:document.getElementById('pName').value.trim(),phone:document.getElementById('pPhone').value.trim(),city:document.getElementById('pCity').value.trim()}; const f=document.getElementById('pPhoto').files[0]; if(f){ const r=new FileReader(); r.onload=async()=>{ data.photo=r.result; await window.CyberDB.collection('users').doc(me.uid).update(data); document.getElementById('profileMsg').innerText='Profile saved with photo.'; }; r.readAsDataURL(f); } else { await window.CyberDB.collection('users').doc(me.uid).update(data); document.getElementById('profileMsg').innerText='Profile saved.'; } pushNotif('Profile updated.'); }
async function changePassword(){ const np=document.getElementById('newPass').value; if(!np||np.length<8) return alert('New password must be at least 8 characters.'); try{ await me.updatePassword(np); alert('Password changed. Use the new password next time.'); pushNotif('Password changed.'); }catch(e){ alert('Please sign in again, then change password. '+e.message); } }
async function postAnnouncement(){ const t=document.getElementById('annTitle').value.trim(), m=document.getElementById('annText').value.trim(); if(!t||!m) return alert('Title + message required.'); const ann={title:t,text:m,time:new Date().toLocaleString()}; const all=JSON.parse(localStorage.getItem('cyber_ann')||'[]'); all.unshift(ann); localStorage.setItem('cyber_ann',JSON.stringify(all)); try{ await window.CyberDB.collection('settings').doc('global').set({broadcast:t+': '+m},{merge:true}); }catch(e){} document.getElementById('annBox').innerHTML='<b>'+t+'</b><br>'+m+'<br>'+ann.time; pushNotif('New announcement: '+t); }
function exportCSV(){ const rows=[['Name','Email','City','Role','Blocked']].concat(allUsers.map(u=>[u.name||'',u.email||'',u.city||'',u.role||'',u.blocked?'Yes':'No'])); const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n'); const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='cyber-shield-users.csv'; a.click(); }
function exportExcel(){ const ws=XLSX.utils.json_to_sheet(allUsers.map(u=>({Name:u.name||'',Email:u.email||'',City:u.city||'',Role:u.role||'',Blocked:u.blocked?'Yes':'No'}))); const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Users'); XLSX.writeFile(wb,'cyber-shield-users.xlsx'); }
function exportPDF(){ const {jsPDF}=window.jspdf; const doc=new jsPDF(); doc.text('Cyber Shield - Users Report',14,14); doc.autoTable({head:[['Name','Email','City','Role','Blocked']], body:allUsers.map(u=>[u.name||'',u.email||'',u.city||'',u.role||'',u.blocked?'Yes':'No']), startY:20}); doc.save('cyber-shield-users.pdf'); }
async function logoutAll(){ if(me){ const s=await window.CyberDB.collection('sessions').where('uid','==',me.uid).get(); for(const d of s.docs) await d.ref.delete(); } alert('Signed out from all devices.'); logout(); }
async function logout(){ try{ await window.CyberAuth.signOut(); }catch(e){} localStorage.removeItem('cyber_current_user'); localStorage.removeItem('cyber_role'); location.href='mode2-login.html'; }
renderNotif();
</script><script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body></html>
