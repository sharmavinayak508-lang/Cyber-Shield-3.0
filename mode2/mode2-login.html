<!DOCTYPE html>
<html lang="en"><head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cyber Shield — Sign In</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#050a14">
<style>
:root{--bg:#050a14;--card:rgba(10,22,40,.95);--input:#0f1f3a;--text:#fff;--muted:#9fb0cc;--border:#00d4ff;--accent:var(--accentColor,#00d4ff)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Segoe UI,Roboto,sans-serif}
.wrap{max-width:560px;margin:18px auto;padding:14px}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:22px}
h1{text-align:center;color:#ffaa00;margin:4px 0}.sub{text-align:center;color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
select,input,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:var(--input);color:var(--text);margin:6px 0;font-size:14px}
button{cursor:pointer;border:0;border-radius:10px;padding:12px;font-weight:800;font-size:14px}
.blue{background:var(--accent);color:#000}.green{background:#00ff88;color:#000}.orange{background:#ff8800;color:#fff}.ghost{background:transparent;border:1px solid var(--accent);color:var(--text)}
.tabs{display:flex;gap:8px}.tabs button{flex:1;background:var(--input);color:var(--text)}.tabs button.active{background:var(--accent);color:#000}
.msg{text-align:center;font-weight:700;min-height:18px;margin:8px 0;color:#ffb347}.msg.ok{color:#00ff88}
.bar{height:4px;background:#222;border-radius:99px;overflow:hidden;margin:2px 0 4px}.bar i{display:block;height:100%;background:#ff4444;width:0}
.box{background:rgba(0,255,136,.08);border:1px solid #00aa77;border-radius:10px;padding:10px;font-size:13px;margin:8px 0}
.small{font-size:12px;color:var(--muted);text-align:center}.lbl{font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:700;display:block;margin:10px 0 0}.link{color:var(--accent);cursor:pointer;font-weight:800}
.passWrap{position:relative}.passWrap button{position:absolute;right:8px;top:50%;transform:translateY(-50%);padding:6px 9px;font-size:12px}
.pill{display:inline-block;padding:4px 10px;border-radius:99px;background:rgba(0,212,255,.16);font-size:11px;font-weight:800}
.hidden{display:none}
</style></head>
<body><div class="wrap"><div class="card">
<div style="text-align:center"><div style="font-size:34px">🛡️</div>
<h1>CYBER SHIELD</h1>
<p class="sub" id="welcomeText">Welcome back. Sign in to your account.</p></div>
<div id="broadcastBar" class="box hidden"></div><div id="lockdownBar" class="box hidden"></div>

<div class="tabs"><button id="tabLogin" class="active" onclick="showTab('login')">Sign In</button><button id="tabReg" onclick="showTab('register')">Create Account</button></div>

<input id="uName" placeholder="Full name" autocomplete="name">
<input id="uEmail" type="email" placeholder="Email" autocomplete="email">
<input id="uPhone" placeholder="Phone (optional)" autocomplete="tel">
<input id="uCity" placeholder="City (optional)" autocomplete="address-level2">
<input id="uState" placeholder="State (optional)" autocomplete="address-level1">
<select id="roleSel"><option value="user">User</option><option value="admin">Request Admin access</option><option value="viewer">Viewer</option></select>

<div class="passWrap"><input id="uPass" type="password" placeholder="Password" autocomplete="current-password">
<button type="button" onclick="togglePass()">Show</button></div>
<div class="bar" id="strengthWrap"><i id="strengthBar"></i></div>

<label class="lbl">Sign-in method</label>
<select id="loginMethod" onchange="switchLoginMethod()">
<option value="password">Password</option>
<option value="face-webauthn">Face ID / Fingerprint</option>
<option value="face-camera">Face Scan (Camera)</option>
</select>

<div id="faceBox" class="box hidden">
<video id="faceVideo" width="100%" style="border-radius:10px;display:none" autoplay playsinline muted></video>
<canvas id="faceCanvas" width="320" height="240" style="display:none"></canvas>
<img id="facePreview" style="width:100%;border-radius:10px;display:none">
<div class="row"><button type="button" class="green" onclick="startFaceLogin()">Scan my face</button>
<button type="button" class="ghost" onclick="stopFaceCamera()">Stop camera</button></div>
<p class="small" id="faceMsg"></p>
</div>

<button class="blue" style="width:100%" id="mainBtn" onclick="doAuth()">Sign In →</button>
<p class="small"><span class="link" onclick="forgotPassword()">Forgot password?</span> • <span class="link" onclick="resendVerify()">Resend verification email</span></p>
<p class="small" id="lockInfo"></p>
<p id="msg" class="msg"></p>
<p class="small" style="margin-top:14px"><span class="link" onclick="createTicket()">Need help?</span> • <span class="link" onclick="installPWA()">Install app</span> • <span class="link" onclick="location.href='../index.html'">Back</span></p>
<p class="small" style="opacity:.6">Protected by Cyber Shield</p>
</div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.min.js"></script>
<script src="mode2-config.js"></script>
<script src="mode2-location.js"></script>
<script src="mode2-mail.js"></script>
<script>
let mode='login';
let deferredPrompt=null; window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;});
function installPWA(){ if(deferredPrompt){deferredPrompt.prompt();} else alert('On mobile: Share → Add to Home Screen to install.'); }
function trustedKey(email){ return 'cyber_trusted_'+email.toLowerCase()+'_'+(navigator.userAgent||'').slice(0,40); }
function checkTrusted(email){ if(!localStorage.getItem(trustedKey(email))){ if(confirm('New device detected. Trust this device?')) localStorage.setItem(trustedKey(email),'1'); } }
async function createAdminRequest(uid,u){ try{ const q=await window.CyberDB.collection('admin_requests').where('uid','==',uid).where('status','==','pending').get(); if(!q.empty) return; await window.CyberDB.collection('admin_requests').add({uid,email:u.email||'',name:u.name||'',phone:u.phone||'',city:u.city||'',state:u.state||'',status:'pending',createdAt:firebase.firestore.FieldValue.serverTimestamp()}); }catch(e){} }
async function forgotPassword(){ const email=document.getElementById('uEmail').value.trim(); if(!email) return setMsg('Enter your email first, then click Forgot Password.'); try{ await window.CyberAuth.sendPasswordResetEmail(email); setMsg('Password reset link sent. Check inbox + spam.',true); }catch(e){ setMsg(e.message.replace('Firebase: ','')); } }
async function resendVerify(){ const email=document.getElementById('uEmail').value.trim(),pass=document.getElementById('uPass').value.trim(); if(!email||!pass) return setMsg('Enter email + password to resend verification.'); try{ const c=await window.CyberAuth.signInWithEmailAndPassword(email,pass); await c.user.sendEmailVerification(); await window.CyberAuth.signOut(); setMsg('Verification email sent.',true); }catch(e){ setMsg(e.message.replace('Firebase: ','')); } }
function createTicket(){ const txt=prompt('Describe your issue:'); if(!txt) return; const email=document.getElementById('uEmail').value.trim()||'guest'; try{ window.CyberDB.collection('support_tickets').add({email,text:txt,status:'Open',createdAt:firebase.firestore.FieldValue.serverTimestamp()}); }catch(e){} setMsg('Thanks. Your request has been received.',true); }
function setMsg(m,ok){ const el=document.getElementById('msg'); el.innerText=m; el.className='msg'+(ok?' ok':''); }
function togglePass(){ const p=document.getElementById('uPass'); p.type=p.type==='password'?'text':'password'; }
function showTab(m){ mode=m; document.getElementById('tabLogin').className=m==='login'?'active':''; document.getElementById('tabReg').className=m==='register'?'active':''; document.getElementById('mainBtn').innerHTML=m==='login'?'Sign In →':'Create Account →'; document.getElementById('welcomeText').innerText=m==='login'?'Welcome back. Sign in to your account.':'Create your account to get started.'; ['uName','uPhone','uCity','uState','roleSel'].forEach(id=>document.getElementById(id).style.display=m==='register'?'block':'none'); document.getElementById('strengthWrap').style.display=m==='register'?'block':'none'; }
showTab('login');
document.getElementById('uPass').addEventListener('input',e=>{ const v=e.target.value; let s=0; if(v.length>=8)s++; if(/[A-Z]/.test(v))s++; if(/[0-9]/.test(v))s++; if(/[^A-Za-z0-9]/.test(v))s++; const pct=[0,25,50,75,100][s]; const col=['#555','#ff4444','#ff8800','#00d4ff','#00ff88'][s]; const b=document.getElementById('strengthBar'); b.style.width=pct+'%'; b.style.background=col; });
async function getLocation(){ try{ if(window.getCurrentLocation) return await window.getCurrentLocation(); }catch(e){} return await new Promise(res=>{ if(!navigator.geolocation) return res(null); navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy}),()=>res(null),{timeout:8000}); }); }
async function getGlobalSettings(){ try{ const d=await window.CyberDB.collection('settings').doc('global').get(); if(d.exists) return d.data(); }catch(e){} return {lockdown:false,broadcast:''}; }
function lockKey(email){ return 'cyber_lock_'+email.toLowerCase(); }
function isLocked(email){ const d=JSON.parse(localStorage.getItem(lockKey(email))||'null'); if(d && Date.now()<d.until){ document.getElementById('lockInfo').innerText='Account temporarily locked. Try again in '+Math.ceil((d.until-Date.now())/60000)+' minute(s).'; return true; } return false; }
function recordFail(email){ const k=lockKey(email); const d=JSON.parse(localStorage.getItem(k)||'{"count":0}'); d.count++; if(d.count>=5){ d.until=Date.now()+15*60000; d.count=0; setMsg('Too many failed attempts. Locked for 15 minutes.'); } localStorage.setItem(k,JSON.stringify(d)); }
function clearFail(email){ localStorage.removeItem(lockKey(email)); }
async function saveHistory(email,ok,loc,uid,method){ const rec={email,time:new Date().toLocaleString('en-IN',{timeZone:'Asia/Kolkata'}),ok:!!ok,device:navigator.userAgent.slice(0,60),lat:loc?loc.lat:'',lng:loc?loc.lng:'',method:method||'password',uid:uid||'',createdAt:firebase.firestore.FieldValue.serverTimestamp()}; const h=JSON.parse(localStorage.getItem('cyber_history')||'[]'); h.unshift(rec); localStorage.setItem('cyber_history',JSON.stringify(h.slice(0,20))); try{ await window.CyberDB.collection('login_history').add(rec); }catch(e){} }
function goDashboard(role){ location.href='mode2-dashboard-v4.html'; }
async function finishLogin(cred,u,loc){
  clearFail(u.email||cred.user.email); saveHistory(u.email||cred.user.email,true,loc,cred.user.uid);
  checkTrusted(u.email||cred.user.email);
  if(window.logSIEMCloud) await window.logSIEMCloud('login_success',{email:u.email,role:u.role,location:loc});
  if(window.sendAuthMail) await window.sendAuthMail('login',{email:u.email,name:u.name||'',location:loc,time:new Date().toISOString()});
  localStorage.setItem('cyber_current_user',u.email); localStorage.setItem('cyber_role',u.role);
  setMsg('Welcome back. Redirecting…',true); goDashboard(u.role);
}
async function doAuth(){
  const email=document.getElementById('uEmail').value.trim(), pass=document.getElementById('uPass').value.trim();
  if(!email||pass.length<8){ setMsg('Enter email + password (min 8 characters).'); return; }
  if(isLocked(email)) return;
  setMsg('Verifying…');
  const loc=await getLocation();
  if(!loc){ setMsg('Location verification is required. Allow location and try again.'); return; }
  try{
    if(mode==='login'){
      const cred=await window.CyberAuth.signInWithEmailAndPassword(email,pass);
      await cred.user.reload();
      if(!cred.user.emailVerified){ setMsg('Email not verified. Check inbox + spam.'); await window.CyberAuth.signOut(); return; }
      const doc=await window.CyberDB.collection('users').doc(cred.user.uid).get();
      if(!doc.exists){ setMsg('Account not found.'); return; }
      const u=doc.data(); if(u.blocked){ setMsg('This account is restricted.'); await window.CyberAuth.signOut(); return; }
      const gs=await getGlobalSettings(); if(gs.lockdown && u.role!=='super_admin'){ setMsg('Platform is in lockdown.'); await window.CyberAuth.signOut(); return; }
      const pickedRole=document.getElementById('roleSel').value;
      if(pickedRole==='admin' && u.role!=='admin' && u.role!=='super_admin'){ await createAdminRequest(cred.user.uid,u); setMsg('Admin request sent.'); }
      await finishLogin(cred,u,loc);
    } else {
      const name=document.getElementById('uName').value.trim()||email.split('@')[0];
      const phone=document.getElementById('uPhone').value.trim(), city=document.getElementById('uCity').value.trim(), state=document.getElementById('uState').value.trim();
      const rolePicked=document.getElementById('roleSel').value;
      let role=rolePicked, wantsAdmin=(rolePicked==='admin');
      if(email.toLowerCase()===String(window.SUPER_ADMIN_EMAIL||'').toLowerCase()){ role='super_admin'; wantsAdmin=false; }
      else if(wantsAdmin){ role='user'; }
      const cred2=await window.CyberAuth.createUserWithEmailAndPassword(email,pass);
      try{ await cred2.user.sendEmailVerification(); }catch(e){}
      await window.CyberDB.collection('users').doc(cred2.user.uid).set({email:email,name:name,phone:phone,city:city,state:state,role:role,blocked:false,emailVerified:false,location:loc,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
      if(wantsAdmin){ await createAdminRequest(cred2.user.uid,{email:email,name:name,phone:phone,city:city,state:state}); }
      if(window.logSIEMCloud) await window.logSIEMCloud('signup',{email:email,role:role,location:loc});
      if(window.sendAuthMail) await window.sendAuthMail('register',{email:email,name:name,phone:phone,city:city,state:state,location:loc,time:new Date().toISOString()});
      setMsg(wantsAdmin?'Account created. Admin request sent. Verify email before sign-in.':'Account created. Verify email, then sign in.',true);
      await window.CyberAuth.signOut(); showTab('login');
    }
  }catch(e){ recordFail(email); saveHistory(email,false,loc); setMsg(e.message.replace('Firebase: ','').replace('auth/','')); if(window.logSIEMCloud) await window.logSIEMCloud('login_failed',{email:email,error:e.message,location:loc}); }
}
// Model: TinyFaceDetector + FaceLandmark68 + FaceRecognitionNet (128-D descriptor)
// Enroll: 3 captures -> average descriptor -> stored in Firestore users/<uid>.faceDescriptor + local backup
// Verify: 1 capture -> descriptor -> Euclidean distance to enrolled. Match if distance < 0.60
let faceModelsLoaded=false;
async function loadFaceModels(){
  if(faceModelsLoaded) return true;
  try{
    const CDN='https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/model/';
    await Promise.all([faceapi.nets.tinyFaceDetector.loadFromUri(CDN), faceapi.nets.faceLandmark68Net.loadFromUri(CDN), faceapi.nets.faceRecognitionNet.loadFromUri(CDN)]);
    faceModelsLoaded=true; return true;
  }catch(e){ document.getElementById('faceMsg').innerText='Face models failed to load. Check internet or use Password.'; return false; }
}
async function descriptorFromVideo(videoEl){
  const det=await faceapi.detectSingleFace(videoEl, new faceapi.TinyFaceDetectorOptions({inputSize:320, scoreThreshold:0.5})).withFaceLandmarks().withFaceDescriptor();
  if(!det) return null; return Array.from(det.descriptor);
}
function faceDistance(a,b){ let s=0; for(let i=0;i<a.length;i++){ const d=a[i]-b[i]; s+=d*d; } return Math.sqrt(s); }
async function getEnrolledDescriptor(email){
  // 1) Firestore by email (needs signed-in? login page is logged-out, so use local backup + Firestore via users query if rules allow)
  try{ const q=await window.CyberDB.collection('users').where('email','==',email).limit(1).get(); if(!q.empty && q.docs[0].data().faceDescriptor) return q.docs[0].data().faceDescriptor; }catch(e){}
  try{ const local=JSON.parse(localStorage.getItem('cyber_face_desc_'+email.toLowerCase())||'null'); if(local) return local; }catch(e){}
  return null;
}
async function saveEnrolledDescriptor(uid,email,desc){
  try{ await window.CyberDB.collection('users').doc(uid).set({faceDescriptor:desc, faceEnrolledAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true}); }catch(e){}
  try{ localStorage.setItem('cyber_face_desc_'+email.toLowerCase(), JSON.stringify(desc)); }catch(e){}
}
// Choice is stored per-device. Default is always Password, never forced.
let faceStream=null;
function faceKey(email){ return 'cyber_face_'+(email||'').toLowerCase(); }
function webauthnKey(email){ return 'cyber_webauthn_'+(email||'').toLowerCase(); }
function switchLoginMethod(){
  const m=document.getElementById('loginMethod').value;
  const passBox=document.getElementById('uPass');
  const mainBtn=document.getElementById('mainBtn');
  const faceBox=document.getElementById('faceBox');
  localStorage.setItem('cyber_login_method',m);
  const isFace = m!=='password';
  passBox.style.display=isFace?'none':'block'; mainBtn.style.display=isFace?'none':'block';
  faceBox.classList.toggle('hidden', !isFace);
}
document.getElementById('loginMethod').value = localStorage.getItem('cyber_login_method')||'password';
switchLoginMethod();
function stopFaceCamera(){ if(faceStream){ faceStream.getTracks().forEach(t=>t.stop()); faceStream=null; } const v=document.getElementById('faceVideo'); v.style.display='none'; v.srcObject=null; }
async function startCamera(){
  try{ faceStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}}); const v=document.getElementById('faceVideo'); v.srcObject=faceStream; v.style.display='block'; return true; }
  catch(e){ document.getElementById('faceMsg').innerText='Camera blocked. Allow camera permission, or use Password / Device Face ID instead.'; return false; }
}
// WebAuthn helpers
function bufToB64(buf){ let s=''; new Uint8Array(buf).forEach(b=>s+=String.fromCharCode(b)); return btoa(s); }
function b64ToBuf(b64){ const s=atob(b64); const a=new Uint8Array(s.length); for(let i=0;i<s.length;i++) a[i]=s.charCodeAt(i); return a.buffer; }
async function enrollWebAuthn(email){
  if(!window.PublicKeyCredential) throw new Error('WebAuthn not supported on this browser/device.');
  const challenge=crypto.getRandomValues(new Uint8Array(32));
  const cred=await navigator.credentials.create({publicKey:{challenge, rp:{name:'Cyber Shield', id:location.hostname}, user:{id:new TextEncoder().encode(email), name:email, displayName:email}, pubKeyCredParams:[{alg:-7,type:'public-key'},{alg:-257,type:'public-key'}], authenticatorSelection:{authenticatorAttachment:'platform', userVerification:'required'}, timeout:60000, attestation:'none'}});
  localStorage.setItem(webauthnKey(email), JSON.stringify({id:bufToB64(cred.rawId), type:cred.type}));
  return cred;
}
async function verifyWebAuthn(email){
  const saved=JSON.parse(localStorage.getItem(webauthnKey(email))||'null');
  if(!saved) throw new Error('No Face ID enrolled for this email on this device.');
  const challenge=crypto.getRandomValues(new Uint8Array(32));
  await navigator.credentials.get({publicKey:{challenge, allowCredentials:[{id:b64ToBuf(saved.id), type:'public-key'}], userVerification:'required', timeout:60000}});
  return true;
}
// Main Face Scan entry - called from Scan button
async function startFaceLogin(){
  const email=document.getElementById('uEmail').value.trim();
  if(!email){ setMsg('Enter your email first, then Scan Face.'); return; }
  if(isLocked(email)) return;
  const method=document.getElementById('loginMethod').value;
  const loc=await getLocation(); if(!loc){ setMsg('Location verification is required. Allow location and try again.'); return; }
  try{
    if(method==='face-webauthn'){
      document.getElementById('faceMsg').innerText='Waiting for Face ID / fingerprint… Look at your device / touch sensor.';
      await verifyWebAuthn(email);
      document.getElementById('faceMsg').innerText='Face verified on device. Signing you in…';
    } else {
      // Camera Real: must have enrolled photo for this email on this device
      const enrolled=localStorage.getItem(faceKey(email));
      if(!enrolled){ document.getElementById('faceMsg').innerText='No face enrolled for this email.'; return; }
      if(!await startCamera()) return;
      document.getElementById('faceMsg').innerText='Camera on — position your face, then tap Capture & Verify below.';
      // Add capture button dynamically once
      if(!document.getElementById('faceCaptureBtn')){
        const b=document.createElement('button'); b.id='faceCaptureBtn'; b.type='button'; b.className='blue'; b.style.width='100%'; b.style.marginTop='8px'; b.innerText='📸 Capture & Verify Face (Real)'; b.onclick=()=>captureAndVerifyFace(email,loc); document.getElementById('faceBox').appendChild(b);
      }
      return; // wait for capture click
    }
    // WebAuthn success -> do normal Firebase sign-in WITHOUT asking password again?
    // Security: WebAuthn alone must NOT bypass password in production unless you wire it to a server.
    // So here we do: WebAuthn proves device biometrics, then we still need the Firebase session.
    // For real usability, we ask for password ONLY if no Firebase session exists — see note below.
    await faceFinishLogin(email,loc);
  }catch(e){ setMsg('Face Scan failed / cancelled.'); document.getElementById('faceMsg').innerText=e.message||'Face Scan cancelled.'; }
}
async function captureAndVerifyFace(email,loc){
  document.getElementById('faceMsg').innerText='Loading face models…';
  if(!await loadFaceModels()) return;
  const enrolled=await getEnrolledDescriptor(email);
  if(!enrolled){ document.getElementById('faceMsg').innerText='No enrolled face found for this email.'; stopFaceCamera(); return; }
  const v=document.getElementById('faceVideo');
  document.getElementById('faceMsg').innerText='Look at camera — capturing and matching your face…';
  await new Promise(r=>setTimeout(r,800));
  const desc=await descriptorFromVideo(v);
  if(!desc){ document.getElementById('faceMsg').innerText='No face detected. Move closer, good light, look straight. Try again.'; return; }
  const dist=faceDistance(desc,enrolled);
  document.getElementById('faceMsg').innerText='Face match distance: '+dist.toFixed(3)+' (match needs < 0.60)';
  stopFaceCamera();
  if(dist>=0.60){ recordFail(email); saveHistory(email,false,loc); setMsg('Face did not match. Try again or use Password.'); return; }
  // Real match -> now complete Firebase sign-in. Firebase still needs a credential, so we use
  // passwordless Email Link (Real, no password typed): send link, user clicks link in inbox to enter.
  // This makes Face Scan truly passwordless and NOT a real bypass.
  try{
    const actionCodeSettings={url:location.href, handleCodeInApp:true};
    await window.CyberAuth.sendSignInLinkToEmail(email, actionCodeSettings);
    window.localStorage.setItem('emailForSignIn', email);
    window.localStorage.setItem('cyber_face_verified_'+email.toLowerCase(), JSON.stringify({at:Date.now(), dist}));
    setMsg('Face matched. Sign-in link sent to '+email+'.', true);
    document.getElementById('faceMsg').innerText='Check your inbox for the sign-in link.';
  }catch(e){ setMsg('Face matched, but email link failed: '+e.message); }
}
async function faceFinishLogin(email,loc){
  // Real WebAuthn: device already verified biometrics in verifyWebAuthn().
  // Now send Real Firebase Email Link (passwordless) - no password prompt, no real.
  try{
    const actionCodeSettings={url:location.href, handleCodeInApp:true};
    await window.CyberAuth.sendSignInLinkToEmail(email, actionCodeSettings);
    window.localStorage.setItem('emailForSignIn', email);
    setMsg('Face verified. Sign-in link sent to '+email+'.', true);
  }catch(e){ setMsg('Face verified, but email link failed: '+e.message); }
}
// Handle Email Link sign-in on page load (Real passwordless flow)
(async()=>{ try{
  if(window.CyberAuth.isSignInWithEmailLink(window.location.href)){
    let email=window.localStorage.getItem('emailForSignIn')||'';
    if(!email) email=prompt('Enter your email to complete sign-in:')||'';
    const loc=await getLocation();
