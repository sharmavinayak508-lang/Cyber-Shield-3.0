<!DOCTYPE html>
<html lang="en"><head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}

</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cyber Shield - Secure Sign In</title>
<style>*{box-sizing:border-box}body{margin:0;background:#050a14;color:#fff;font-family:sans-serif;background-image:url('https://images.unsplash.com/photo-1611689342806-0863700ce1e4?w=1200&q=80');background-size:cover;background-position:center}
.overlay{background:rgba(0,0,0,.55);min-height:100vh;padding:16px}
.card{max-width:520px;margin:20px auto;background:rgba(10,22,40,.92);border:1px solid #00d4ff;border-radius:16px;padding:16px}
h1{color:#ffaa00;text-align:center;margin:4px 0}h1+p{text-align:center;opacity:.85;font-size:13px}
select,input{width:100%;padding:11px;border-radius:10px;border:1px solid #333;background:#0f1f3a;color:#fff;margin:6px 0}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
button{cursor:pointer;border:0;border-radius:10px;padding:11px;font-weight:800}
.green{background:#00ff88}.orange{background:#ff8800;color:#fff}.blue{background:#00d4ff}.red{background:#ff3b3b;color:#fff}
.box{background:rgba(0,255,136,.12);border:1px solid #00ff88;border-radius:10px;padding:10px;font-size:13px;margin:8px 0}
.roleInfo{background:#0a1628;border:1px solid #333;border-radius:10px;padding:10px;font-size:13px;margin:8px 0}
.tabs{display:flex;gap:8px}.tabs button{flex:1}.tabs button.active{background:#00d4ff;color:#000}
.msg{text-align:center;font-size:13px;font-weight:700;min-height:18px;margin:8px 0;color:#ffb347}
.foot{text-align:center;opacity:.6;font-size:12px;margin-top:10px}
.hidden{display:none}
</style></head>
<body><div class="overlay"><div class="card">
<h1>🦅 CYBER SHIELD</h1><p>Security Platform &bull; Secure Sign In</p>
<div class="row">
<select id="langSel"><option>English</option><option>Hindi</option></select>
<select id="roleSel" onchange="showRoleInfo()">
<option value="admin">Admin</option>
<option value="user">User</option>
<option value="viewer">Viewer</option>
</select>
</div>
<div id="roleInfo" class="roleInfo"></div>
<div class="tabs"><button id="tabLogin" class="active" onclick="showTab('login')">Sign In</button><button id="tabReg" onclick="showTab('register')">Create Account</button></div>
<input id="uName" placeholder="Full Name">
<input id="uEmail" type="email" placeholder="Email">
<input id="uPhone" placeholder="Phone">
<input id="uCity" placeholder="City">
<input id="uState" placeholder="State">
<input id="uPass" type="password" placeholder="Password">
<div class="box">Protected by Cyber Shield &bull; Location-verified sign-in &bull; Activity is logged for security.</div>
<button class="blue" style="width:100%" id="mainBtn" onclick="doAuth()">Sign In &rarr;</button>
<button class="orange" style="width:100%;margin-top:8px" onclick="location.href='../index.html'">&larr; Back</button>
<p id="msg" class="msg"></p>
<p class="foot">Cyber Shield &bull; Privacy &bull; Terms &bull; Version 3.0</p>
</div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="mode2-config.js"></script>
<script src="mode2-location.js"></script>
<script src="mode2-mail.js"></script>
<script>
let mode='login';
function showRoleInfo(){var r=document.getElementById('roleSel').value;var el=document.getElementById('roleInfo');if(r==='admin')el.innerHTML='<b>Admin:</b> Manage users, approvals and security controls.';else if(r==='user')el.innerHTML='<b>User:</b> Access your dashboard and profile.';else el.innerHTML='<b>Viewer:</b> View-only access.';}
showRoleInfo();
function showTab(t){mode=t;document.getElementById('tabLogin').className=t==='login'?'active':'';document.getElementById('tabReg').className=t==='register'?'active':'';document.getElementById('mainBtn').innerText=t==='login'?'Sign In \u2192':'Create Account \u2192';['uName','uPhone','uCity','uState'].forEach(function(id){document.getElementById(id).style.display=t==='register'?'block':'none';});}
showTab('login');
function setMsg(m){document.getElementById('msg').innerText=m;}
async function getLocation(){try{if(window.getCurrentLocation)return await window.getCurrentLocation();}catch(e){}return await new Promise(function(res){if(!navigator.geolocation)return res(null);navigator.geolocation.getCurrentPosition(function(p){res({lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy});},function(){res(null);},{timeout:8000});});}
async function doAuth(){
  var email=document.getElementById('uEmail').value.trim(),pass=document.getElementById('uPass').value.trim();
  if(!email||pass.length<6){setMsg('Please enter a valid email and a password of at least 6 characters.');return;}
  setMsg('Verifying location and signing you in...');
  var loc=await getLocation();
  if(!loc){setMsg('Location verification is required. Please allow location access and try again.');return;}
  try{
    if(mode==='login'){
      var cred=await window.CyberAuth.signInWithEmailAndPassword(email,pass);
      var doc=await window.CyberDB.collection('users').doc(cred.user.uid).get();
      if(!doc.exists){setMsg('Account record not found. Please create an account.');return;}
      var u=doc.data(); if(u.blocked){setMsg('This account is restricted. Please contact support.');await window.CyberAuth.signOut();return;}
      if(window.logSIEMCloud)await window.logSIEMCloud('login_success',{email:email,role:u.role,location:loc});
      if(window.sendAuthMail)await window.sendAuthMail('login',{email:email,name:u.name||'',location:loc,time:new Date().toISOString()});
      localStorage.setItem('cyber_current_user',u.email);localStorage.setItem('cyber_role',u.role);
      setMsg('Welcome back. Redirecting...');
      location.href='mode2-dashboard.html';
    } else {
      var name=document.getElementById('uName').value.trim()||email.split('@')[0];
      var phone=document.getElementById('uPhone').value.trim(),city=document.getElementById('uCity').value.trim(),state=document.getElementById('uState').value.trim();
      var role=document.getElementById('roleSel').value;
      if(email.toLowerCase()===String(window.SUPER_ADMIN_EMAIL||'').toLowerCase())role='super_admin';
      var cred2=await window.CyberAuth.createUserWithEmailAndPassword(email,pass);
      await window.CyberDB.collection('users').doc(cred2.user.uid).set({email:email,name:name,phone:phone,city:city,state:state,role:role,blocked:false,location:loc,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
      if(window.logSIEMCloud)await window.logSIEMCloud('signup',{email:email,role:role,location:loc});
      if(window.sendAuthMail)await window.sendAuthMail('register',{email:email,name:name,phone:phone,city:city,state:state,location:loc,time:new Date().toISOString()});
      setMsg('Account created. Please sign in.'); showTab('login');
    }
  }catch(e){setMsg(e.message.replace('Firebase: ','').replace('auth/','')); if(window.logSIEMCloud)await window.logSIEMCloud('login_failed',{email:email,error:e.message,location:loc});}
}
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body></html>
