var curLang = localStorage.getItem('cyber_lang') || 'en';
var curTheme = localStorage.getItem('cyber_theme') || 'dark';
function t(k){ return (LANG[curLang] && LANG[curLang][k]) || LANG.en[k] || k; }
function setTheme(th){ curTheme = th; localStorage.setItem('cyber_theme', th); document.documentElement.setAttribute('data-theme', th); var s=document.getElementById('themeSel'); if(s) s.value=th; }
function setLanguage(l){ curLang = LANG[l] ? l : 'en'; localStorage.setItem('cyber_lang', curLang); document.documentElement.lang = curLang; applyLanguage(); }
function applyLanguage(){
  document.querySelectorAll('[data-i18n]').forEach(function(el){ var k=el.getAttribute('data-i18n'); if(t(k)) el.innerHTML = t(k); });
  document.querySelectorAll('[data-i18n-ph]').forEach(function(el){ var k=el.getAttribute('data-i18n-ph'); if(t(k)) el.placeholder = t(k); });
  var ls=document.getElementById('langSel'); if(ls) ls.value=curLang;
  showRoleInfo(); showTab(mode);
  document.title = t('pageTitle');
}
let mode='login';
function showRoleInfo(){var r=document.getElementById('roleSel').value;var el=document.getElementById('roleInfo');if(r==='admin')el.innerHTML=t('roleAdminInfo');else if(r==='user')el.innerHTML=t('roleUserInfo');else el.innerHTML=t('roleViewerInfo');}
function showTab(m){mode=m;document.getElementById('tabLogin').className=m==='login'?'active':'';document.getElementById('tabReg').className=m==='register'?'active':'';document.getElementById('mainBtn').innerHTML=m==='login'?t('btnSignIn'):t('btnCreate');['uName','uPhone','uCity','uState'].forEach(function(id){document.getElementById(id).style.display=m==='register'?'block':'none';});}
function setMsg(m){document.getElementById('msg').innerText=m;}
async function getLocation(){try{if(window.getCurrentLocation)return await window.getCurrentLocation();}catch(e){}return await new Promise(function(res){if(!navigator.geolocation)return res(null);navigator.geolocation.getCurrentPosition(function(p){res({lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy});},function(){res(null);},{timeout:8000});});}
async function resendVerify(){ var email=document.getElementById('uEmail').value.trim(),pass=document.getElementById('uPass').value.trim(); if(!email||!pass){setMsg(t('msgResendNeed'));return;} try{ var c=await window.CyberAuth.signInWithEmailAndPassword(email,pass); await c.user.sendEmailVerification(); await window.CyberAuth.signOut(); setMsg(t('msgResendDone')); }catch(e){ setMsg(e.message.replace('Firebase: ','')); } }
async function doAuth(){
  var email=document.getElementById('uEmail').value.trim(),pass=document.getElementById('uPass').value.trim();
  if(!email||pass.length<6){setMsg(t('msgInvalid'));return;}
  setMsg(t('msgVerifying'));
  var loc=await getLocation();
  if(!loc){setMsg(t('msgLocation'));return;}
  try{
    if(mode==='login'){
      var cred=await window.CyberAuth.signInWithEmailAndPassword(email,pass);
      await cred.user.reload();
      if(!cred.user.emailVerified){ setMsg(t('msgNotVerified')); await window.CyberAuth.signOut(); return; }
      var doc=await window.CyberDB.collection('users').doc(cred.user.uid).get();
      if(!doc.exists){setMsg(t('msgNoRecord'));return;}
      var u=doc.data(); if(u.blocked){setMsg(t('msgBlocked'));await window.CyberAuth.signOut();return;}
      if(window.logSIEMCloud)await window.logSIEMCloud('login_success',{email:email,role:u.role,location:loc});
      if(window.sendAuthMail)await window.sendAuthMail('login',{email:email,name:u.name||'',location:loc,time:new Date().toISOString()});
      localStorage.setItem('cyber_current_user',u.email);localStorage.setItem('cyber_role',u.role);
      setMsg(t('msgWelcome'));
      location.href='mode2-user-dashboard.html';
    } else {
      var name=document.getElementById('uName').value.trim()||email.split('@')[0];
      var phone=document.getElementById('uPhone').value.trim(),city=document.getElementById('uCity').value.trim(),state=document.getElementById('uState').value.trim();
      var role=document.getElementById('roleSel').value;
      if(email.toLowerCase()===String(window.SUPER_ADMIN_EMAIL||'').toLowerCase())role='super_admin';
      var cred2=await window.CyberAuth.createUserWithEmailAndPassword(email,pass);
      try{ await cred2.user.sendEmailVerification(); }catch(e){}
      await window.CyberDB.collection('users').doc(cred2.user.uid).set({email:email,name:name,phone:phone,city:city,state:state,role:role,blocked:false,emailVerified:false,location:loc,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
      if(window.logSIEMCloud)await window.logSIEMCloud('signup',{email:email,role:role,location:loc});
      if(window.sendAuthMail)await window.sendAuthMail('register',{email:email,name:name,phone:phone,city:city,state:state,location:loc,time:new Date().toISOString()});
      setMsg(t('msgCreated')); await window.CyberAuth.signOut(); showTab('login');
    }
  }catch(e){setMsg(e.message.replace('Firebase: ','').replace('auth/','')); if(window.logSIEMCloud)await window.logSIEMCloud('login_failed',{email:email,error:e.message,location:loc});}
}
setTheme(curTheme); applyLanguage();
</script>
